name: Firmware CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run brightness tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_brightness.cpp -o /tmp/bridge-brightness-tests
          /tmp/bridge-brightness-tests
      - name: Build and run registry policy tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_registry_policy.cpp -o /tmp/bridge-registry-tests
          /tmp/bridge-registry-tests

      - name: Build and run preset policy tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_preset_policy.cpp -o /tmp/bridge-preset-tests
          /tmp/bridge-preset-tests

      - name: Build and run portal security policy tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_portal_validation.cpp -o /tmp/bridge-portal-tests
          /tmp/bridge-portal-tests

      - name: Compile and run DeviceRegistry NVS migration tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/stubs -Isrc -Iinclude tests/test_device_registry.cpp src/DeviceRegistry.cpp -o /tmp/bridge-registry-migration
          /tmp/bridge-registry-migration

      - name: Test CSRF token authorization
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_csrf_policy.cpp -o /tmp/bridge-csrf-policy
          /tmp/bridge-csrf-policy
      - name: Test browser CSRF stale-session recovery
        run: node tests/test_portal_csrf.mjs

      - name: Test compressed portal asset
        run: python tests/test_portal_asset.py
      - name: Test network worker state freshness policy
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_worker_policy.cpp -o /tmp/bridge-worker-policy
          /tmp/bridge-worker-policy

      - name: Test HomeKit Hue/Saturation and WLED RGB round-trips
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_color_math.cpp -o /tmp/bridge-color-math
          /tmp/bridge-color-math

      - name: Test opt-in Effects Controller NVS registry and stable AIDs
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/stubs -Isrc -Iinclude \
            tests/test_effects_controller.cpp src/DeviceRegistry.cpp \
            src/EffectsControllerRegistry.cpp -o /tmp/bridge-effects-controller
          /tmp/bridge-effects-controller

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [d1_mini_esp32, cyd_2432s028r]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile firmware
        run: pio run -e ${{ matrix.env }}
      - name: Enforce OTA flash headroom
        run: python tests/check_firmware_size.py .pio/build/${{ matrix.env }}/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error
