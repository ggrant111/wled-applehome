[platformio]
default_envs = d1_mini_esp32

[env]
platform = espressif32 @ 8.0.0
framework = arduino
build_unflags =
    -Os
extra_scripts = pre:tools/prepare_portal.py
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
    homespan/HomeSpan @ 2.1.8
    bblanchon/ArduinoJson @ 7.4.2
build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; Xtensa GCC 14 size optimization; keep OTA and HomeSpan linker unchanged.
    -Oz
    -D WLED_APP_VERSION=\"0.9.3-dev\"

[env:d1_mini_esp32]
board = wemos_d1_mini32

[env:cyd_2432s028r]
; CYD ESP32-2432S028R uses classic ESP32; headless firmware.
board = esp32dev
board_build.flash_mode = dio
